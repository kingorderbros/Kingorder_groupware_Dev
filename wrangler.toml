# Cloudflare Worker 설정 (개발환경 · 2026-09-21 Pages → Worker + Static Assets 로 바꿈)
# Cloudflare 대시보드 › Workers & Pages › Import a repository 가 만드는 프로젝트가 Worker 라서 이에 맞췄습니다.
#   · 정적 파일: 이 폴더 전체 ([assets], 뺄 것은 .assetsignore)
#   · /api/*  : worker.js → functions/api/[[route]].js (Pages Functions 코드 그대로)
# name 은 대시보드에서 만든 Worker 이름과 **같아야** 합니다 (다르면 그 이름으로 Worker 가 하나 더 생깁니다).
name = "kingorder-groupware-dev"
main = "worker.js"
compatibility_date = "2026-09-01"
# 대시보드(Settings › Variables and Secrets)에서 넣은 변수를 배포 때 지우지 않습니다.
# 이게 없으면 wrangler deploy 가 SUPABASE_URL · KOB_ENV 같은 일반 변수를 매번 없애 버립니다 (Secret 은 남음).
keep_vars = true

[assets]
directory = "."
binding = "ASSETS"

# 환경변수(SUPABASE_URL · SUPABASE_SERVICE_ROLE_KEY · KOB_ENV)는 여기 적지 않습니다 —
#   · 로컬:  .dev.vars 파일 (git 에 올리지 않음)
#   · 배포:  Cloudflare 대시보드 › 그 Worker › Settings › Variables and Secrets
