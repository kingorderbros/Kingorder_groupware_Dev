# GitHub → Cloudflare Pages 배포 (개발환경 · 2026-09-16)
#   이 폴더(개발환경)가 **그룹웨어 저장소의 루트**라는 전제입니다 (README 참고).
#   · develop 브랜치 push  → dev 프로젝트(kingorder-groupware-dev)  · 설정 = dev Secrets
#   · main 브랜치 push     → prod 프로젝트(kingorder-groupware)     · 설정 = prod Secrets
#     ※ 2026-09-21 결정: 당분간 **dev 만** 배포합니다 (저장소 kingorderbros/Kingorder_groupware_Dev).
#        prod 는 개발환경에서 UAT 를 마친 최종본을 나중에 올립니다. 그때 아래 branches 에 main 을 다시 넣고
#        *_PROD Secrets 를 채우면 됩니다 — 그 아래 prod 분기 코드는 그대로 두었습니다.
# 필요한 GitHub Secrets (dev 만 쓰는 지금은 앞의 4개)
#   CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID · SUPABASE_URL_DEV · SUPABASE_ANON_KEY_DEV
#   (prod 를 켤 때) SUPABASE_URL_PROD · SUPABASE_ANON_KEY_PROD
# (functions 가 쓰는 SUPABASE_SERVICE_ROLE_KEY 는 GitHub 이 아니라 Cloudflare Pages 환경변수에 둡니다)
#   ※ 2026-09-21: dev 는 Cloudflare Pages 의 **Git 연동**(저장소를 Cloudflare 가 직접 가져옴)으로 배포합니다.
#      develop 에 push 하면 Cloudflare 가 알아서 올리므로 이 워크플로는 자동으로 돌지 않습니다.
#      (Actions 탭 › Run workflow 로 손으로만 실행 — Cloudflare 토큰·Secrets 가 있어야 합니다)
#      prod 도 같은 방식으로 Pages 프로젝트를 하나 더 만들면 이 파일은 계속 안 써도 됩니다.
name: deploy-pages
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read, deployments: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 문법 · 샘플 데이터 검사
        run: npm run check
      - name: 실행 환경 설정 파일 채우기
        env:
          IS_PROD: ${{ github.ref_name == 'main' }}
          URL_DEV: ${{ secrets.SUPABASE_URL_DEV }}
          KEY_DEV: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
          URL_PROD: ${{ secrets.SUPABASE_URL_PROD }}
          KEY_PROD: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
        run: |
          if [ "$IS_PROD" = "true" ]; then ENV=prod; URL="$URL_PROD"; KEY="$KEY_PROD"; else ENV=dev; URL="$URL_DEV"; KEY="$KEY_DEV"; fi
          printf "window.KOB_CONFIG = { env: '%s', supabaseUrl: '%s', supabaseAnonKey: '%s', apiBase: '' };\n" "$ENV" "$URL" "$KEY" > config/app-config.js
          echo "config → $ENV ($URL)"
      - name: Cloudflare Pages 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name ${{ github.ref_name == 'main' && 'kingorder-groupware' || 'kingorder-groupware-dev' }}
